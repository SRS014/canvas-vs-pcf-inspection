App:
  Properties:
    Formulas: |-
      =// ---------- Fusion Sky colour tokens ----------
      cPrimary = ColorValue("#0B5F7E");
      cSecondary = ColorValue("#209CCB");
      cPurple = ColorValue("#742774");
      cText = ColorValue("#0F2530");
      cMuted = ColorValue("#51646E");
      cWash = ColorValue("#EDF7FB");
      cBorder = ColorValue("#CBE2EC");
      cSuccess = ColorValue("#167044");
      cWarning = ColorValue("#8A5A00");
      cError = ColorValue("#B42318");
      cSuccessTint = ColorValue("#E8F3EC");
      cWarningTint = ColorValue("#FBF1DF");
      cErrorTint = ColorValue("#FBE9E7");
      cPrimaryTint = ColorValue("#E3F0F5");
      cPurpleTint = ColorValue("#F3E9F3");
      cWhite = Color.White;
      cLavender = ColorValue("#F5EFF8");

      // ---------- Fusion Sky brand assets (inline SVG, so the app needs no media files) ----------
      // Line gradient: top bar, card top lines and the footer rule.
      BrandLine = "data:image/svg+xml;utf8," & EncodeUrl(
          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 4' preserveAspectRatio='none'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#209CCB'/><stop offset='0.5' stop-color='#742774'/><stop offset='1' stop-color='#E3008C'/></linearGradient></defs><rect width='100' height='4' fill='url(#g)'/></svg>"
      );
      // Light wash: the Home hero.
      BrandWash = "data:image/svg+xml;utf8," & EncodeUrl(
          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><defs><linearGradient id='w' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#EDF7FB'/><stop offset='1' stop-color='#F5EFF8'/></linearGradient></defs><rect width='100' height='100' fill='url(#w)'/></svg>"
      );
      // The gradient ring symbol (fusion-symbol-color-gradient.svg).
      BrandSymbol = "data:image/svg+xml;utf8," & EncodeUrl(
          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='r' gradientUnits='userSpaceOnUse' x1='10' y1='10' x2='54' y2='54'><stop offset='0' stop-color='#209CCB'/><stop offset='1' stop-color='#742774'/></linearGradient></defs><circle cx='32' cy='24.68' r='11.5' fill='none' stroke='#FFFFFF' stroke-width='7.2'/><circle cx='32' cy='24.68' r='11.5' fill='none' stroke='url(#r)' stroke-width='5.4'/><circle cx='23.5' cy='39.4' r='11.5' fill='none' stroke='#FFFFFF' stroke-width='7.2'/><circle cx='23.5' cy='39.4' r='11.5' fill='none' stroke='url(#r)' stroke-width='5.4'/><circle cx='40.5' cy='39.4' r='11.5' fill='none' stroke='#FFFFFF' stroke-width='7.2'/><circle cx='40.5' cy='39.4' r='11.5' fill='none' stroke='url(#r)' stroke-width='5.4'/></svg>"
      );
      BrandTagline = "Fuse ideas. Build smarter. Integrate better.";
      // Decorative gradients as HTML (not focusable, so screen readers skip them; an Image control
      // fails the accessibility checker even when disabled). Each HtmlViewer uses AutoHeight with
      // Size 1, so it grows to fit its content and never shows a scrollbar.
      HtmlLine(px: Number, radius: Number): Text =
          "<div style=""height:" & px & "px;border-radius:" & radius & "px " & radius & "px 0 0;" &
          "background:linear-gradient(90deg,#209CCB,#742774,#E3008C)""></div>";
      HtmlWash(px: Number): Text =
          "<div style=""height:" & px & "px;background:linear-gradient(135deg,#EDF7FB,#F5EFF8)""></div>";

      // ---------- Checklist structure ----------
      Stages = ["Pre-use", "Visual and structural", "Operational test", "Safety sign-off"];

      // Does an answer meet a show or risk condition?
      Meets(answer: Text, op: Text, value: Text): Boolean =
          If(
              IsBlank(answer) || IsBlank(op), false,
              op = "Equals", answer = value,
              op = "Not equals", answer <> value,
              op = "Greater than", IfError(Value(answer) > Value(value), false),
              op = "Less than", IfError(Value(answer) < Value(value), false),
              op = "One of", answer in Split(value, "|"),
              false
          );

      AnswerOf(code: Text): Text = LookUp(colAns, ACode = code).AValue;

      // Session answers live in colAns until Submit.
      SetAnswer(qid: GUID, code: Text, newValue: Text): Void = {
          If(
              IsBlank(LookUp(colAns, AQId = qid)),
              Collect(colAns, {AQId: qid, ACode: code, AValue: newValue}),
              UpdateIf(colAns, AQId = qid, {AValue: newValue})
          )
      };
      ClearAnswer(qid: GUID): Void = { RemoveIf(colAns, AQId = qid) };

      // FL-32's cross-question rule, hard-coded. Canvas can't evaluate the generic
      // rule tree stored in fp_rulejson (no recursion), so each such rule becomes code.
      FL32Visible = (AnswerOf("FL-13") = "Yes" && AnswerOf("FL-30") = "No") || AnswerOf("FL-20") = "No";

      // ---------- Visibility: one formula per level ----------
      // Power Fx functions can't recurse, so the question tree is walked one depth at a time.
      // This app supports five levels (depth 0-4). A sixth level needs a new formula here.
      VisL0 = Filter(colQ, Depth = 0 && (Code <> "FL-32" || FL32Visible));
      VisL1 = Filter(colQ, Depth = 1 && ParentId in VisL0.QId && Meets(LookUp(colAns, AQId = ParentId).AValue, ShowOp, ShowVal));
      VisL2 = Filter(colQ, Depth = 2 && ParentId in VisL1.QId && Meets(LookUp(colAns, AQId = ParentId).AValue, ShowOp, ShowVal));
      VisL3 = Filter(colQ, Depth = 3 && ParentId in VisL2.QId && Meets(LookUp(colAns, AQId = ParentId).AValue, ShowOp, ShowVal));
      VisL4 = Filter(colQ, Depth = 4 && ParentId in VisL3.QId && Meets(LookUp(colAns, AQId = ParentId).AValue, ShowOp, ShowVal));
      VisibleQ = Ungroup(Table({L: VisL0}, {L: VisL1}, {L: VisL2}, {L: VisL3}, {L: VisL4}), L);

      // ---------- Risk ----------
      Multiplier(criticality: Text): Number = Switch(criticality, "High", 1.5, "Medium", 1.25, 1);
      Band(score: Number, criticalStop: Boolean): Text =
          If(criticalStop || score >= 75, "Critical", score >= 50, "High", score >= 25, "Medium", "Low");
      RiskItems = Filter(VisibleQ, Weight > 0 && Meets(LookUp(colAns, AQId = QId).AValue, RiskOp, RiskVal));
      CriticalHit = CountRows(Filter(RiskItems, Critical)) > 0;
      RawPoints = Sum(RiskItems, Weight);
      LiveScore = Min(100, Round(RawPoints * Multiplier(varCtx.Criticality), 1));
      LiveBand = Band(LiveScore, CriticalHit);
      BandColor(band: Text): Color = Switch(band, "Low", cSuccess, "Medium", cWarning, cError);
      BandTint(band: Text): Color = Switch(band, "Low", cSuccessTint, "Medium", cWarningTint, "High", cErrorTint, cError);
      AnsweredCount = CountRows(Filter(VisibleQ, !IsBlank(LookUp(colAns, AQId = QId).AValue)));

      StageIndex(stage: Text): Number =
          Switch(stage, "Pre-use", 1, "Visual and structural", 2, "Operational test", 3, "Safety sign-off", 4, 5);

      // Visible questions with their session answers (used by Review and Submit).
      VisibleAnswers = AddColumns(VisibleQ, AValue, LookUp(colAns, AQId = QId).AValue);

      // Stage tabs with live "answered/visible" counts.
      StageTabs = ForAll(
          Stages As s,
          {
              Value: s.Value,
              Label: s.Value & "  " &
                  CountRows(Filter(VisibleQ, Stage = s.Value && !IsBlank(LookUp(colAns, AQId = QId).AValue))) & "/" &
                  CountRows(Filter(VisibleQ, Stage = s.Value))
          }
      );
    OnStart: |-
      =// Typed, empty session collections. They are filled when an inspection starts.
      ClearCollect(
          colQ,
          {
              QId: GUID(),
              Code: "",
              QText: "",
              Help: "",
              ParentId: GUID(),
              Depth: 0,
              Stage: "",
              SortKey: 0,
              AnswerType: "",
              Options: "",
              ShowOp: "",
              ShowVal: "",
              RiskOp: "",
              RiskVal: "",
              Weight: 0,
              Critical: false,
              // The question row itself, so Submit can set the Question lookup without one query per answer.
              Rec: Defaults('Checklist questions')
          }
      );
      Clear(colQ);
      ClearCollect(colAns, {AQId: GUID(), ACode: "", AValue: ""});
      Clear(colAns);
      Set(
          varCtx,
          {
              InspectionId: GUID(),
              Number: "",
              EquipmentName: "",
              AssetTag: "",
              SiteName: "",
              EquipType: "",
              Criticality: ""
          }
      );
      Set(varStage, "Pre-use");
      Set(varBannerText, "")
    StartScreen: =InspectionsHomeScreen
    Theme: =PowerAppsTheme

Screens:
  PhotoScreen:
    Properties:
      Fill: =cWash
      LoadingSpinnerColor: =cPrimary
      OnVisible: |-
        =UpdateContext({locMode: "View", locSelPhoto: Blank(), locSaving: false, locPhotoError: "", locResetPen: false, locResetAdd: false})
    Children:
      - conPhotoRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =cWash
            DropShadow: =DropShadow.None
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
          Children:
            - conPhotoAccent:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =4
                  Fill: =cSecondary
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutMinHeight: =4
                  LayoutDirection: =LayoutDirection.Horizontal
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
            - conPhotoHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =76
                  Fill: =cWhite
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutMinHeight: =76
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =16
                  PaddingLeft: =16
                  PaddingRight: =24
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnPhotoBack:
                      Control: ModernButton
                      Properties:
                        Text: ="Back to checklist"
                        Icon: ="ArrowLeft"
                        Appearance: =ButtonAppearance.Subtle
                        Color: =cPrimary
                        Height: =48
                        Width: =190
                        Size: =16
                        DisplayMode: =If(locSaving, DisplayMode.Disabled, DisplayMode.Edit)
                        OnSelect: =Navigate(InspectScreen, ScreenTransition.None)
                  - conPhotoTitleBlock:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        Height: =64
                        LayoutMinHeight: =64
                        AlignInContainer: =AlignInContainer.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                      Children:
                        - txtPhotoEyebrow:
                            Control: ModernText
                            Properties:
                              Text: =varCtx.Number & " · PHOTOS"
                              Size: =12
                              FontWeight: =FontWeight.Semibold
                              Color: =cPurple
                              Height: =18
                              LayoutMinHeight: =18
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              AlignInContainer: =AlignInContainer.Stretch
                        - txtPhotoTitle:
                            Control: ModernText
                            Properties:
                              Text: ="Photos and annotation"
                              Size: =22
                              FontWeight: =FontWeight.Semibold
                              Color: =cText
                              Height: =26
                              LayoutMinHeight: =26
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              AlignInContainer: =AlignInContainer.Stretch
                        - txtPhotoContext:
                            Control: ModernText
                            Properties:
                              Text: =varCtx.EquipmentName & " · " & varCtx.AssetTag & " · " & varCtx.SiteName
                              Size: =14
                              Color: =cMuted
                              Wrap: =false
                              Height: =20
                              LayoutMinHeight: =20
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              AlignInContainer: =AlignInContainer.Stretch
                  - addPhotoPicker:
                      Control: AddMedia
                      Properties:
                        Text: ="+  Add picture"
                        ChangePictureText: ="+  Add picture"
                        Fill: =cPrimary
                        Color: =cWhite
                        HoverFill: =ColorFade(cPrimary, -15%)
                        PressedFill: =ColorFade(cPrimary, -25%)
                        DisabledFill: =cBorder
                        DisabledColor: =cMuted
                        Font: =Font.'Segoe UI'
                        Size: =12
                        FontWeight: =FontWeight.Semibold
                        Height: =48
                        Width: =170
                        BorderThickness: =0
                        UseMobileCamera: =true
                        Reset: =locResetAdd
                        AccessibleLabel: ="Add a picture to this inspection"
                        DisplayMode: =If(locMode = "View" && !locSaving, DisplayMode.Edit, DisplayMode.Disabled)
                        OnChange: |-
                          =If(
                              !IsBlank(Self.Media),
                              UpdateContext({locMode: "Add", locPhotoError: ""});
                              Reset(txtPhotoCaption)
                          )
            - conPhotoBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =24
                  PaddingTop: =24
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - conPhotoListCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Width: =360
                        FillPortions: =0
                        LayoutMinWidth: =280
                        Fill: =cWhite
                        BorderColor: =cBorder
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - txtPhotoListHeading:
                            Control: ModernText
                            Properties:
                              Text: ="Photos (" & CountRows(galPhotoList.AllItems) & ")"
                              Size: =18
                              FontWeight: =FontWeight.Semibold
                              Color: =cText
                              Height: =36
                              PaddingLeft: =0
                              AlignInContainer: =AlignInContainer.Stretch
                        - txtPhotoListEmpty:
                            Control: ModernText
                            Properties:
                              Visible: =CountRows(galPhotoList.AllItems) = 0
                              Text: ="No photos yet. Use Add picture to attach one."
                              Size: =14
                              Color: =cMuted
                              Height: =48
                              PaddingLeft: =0
                              AlignInContainer: =AlignInContainer.Stretch
                        - galPhotoList:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              Items: |-
                                =Sort(
                                    Filter('Inspection photos', Inspection.Inspection = varCtx.InspectionId),
                                    'Created On',
                                    SortOrder.Descending
                                )
                              TemplateSize: =96
                              TemplatePadding: =0
                              FillPortions: =1
                              LayoutMinHeight: =120
                              Selectable: =false
                              BorderThickness: =0
                              LoadingSpinnerColor: =cPrimary
                              AccessibleLabel: ="Photos for this inspection"
                            Children:
                              - conPhotoRowCard:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    X: =0
                                    Y: =4
                                    Width: =Parent.TemplateWidth
                                    Height: =88
                                    Fill: =If(locSelPhoto.'Inspection photo' = ThisItem.'Inspection photo', cPrimaryTint, cWhite)
                                    BorderColor: =If(locSelPhoto.'Inspection photo' = ThisItem.'Inspection photo', cPrimary, cBorder)
                                    BorderThickness: =If(locSelPhoto.'Inspection photo' = ThisItem.'Inspection photo', 2, 1)
                                    DropShadow: =DropShadow.None
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                              - imgPhotoThumb:
                                  Control: Image
                                  Properties:
                                    Image: =ThisItem.Photo
                                    ImagePosition: =ImagePosition.Fill
                                    X: =8
                                    Y: =12
                                    Width: =96
                                    Height: =72
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    AccessibleLabel: =ThisItem.Caption
                              - txtPhotoRowCaption:
                                  Control: ModernText
                                  Properties:
                                    Text: =ThisItem.Caption
                                    X: =116
                                    Y: =12
                                    Width: =Parent.TemplateWidth - 124
                                    Height: =44
                                    Size: =16
                                    FontWeight: =FontWeight.Semibold
                                    Color: =cText
                                    VerticalAlign: =VerticalAlign.Top
                                    PaddingLeft: =0
                              - txtPhotoRowTag:
                                  Control: ModernText
                                  Properties:
                                    Visible: =!IsBlank(ThisItem.'Canvas pen strokes')
                                    Text: ="ANNOTATED"
                                    X: =116
                                    Y: =56
                                    Width: =96
                                    Height: =24
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Align: =Align.Center
                                    Color: =cPurple
                                    Fill: =cPurpleTint
                                    BorderColor: =cPurple
                                    BorderThickness: =1
                                    BorderStyle: =BorderStyle.Solid
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                              - btnPhotoRowSelect:
                                  Control: ModernButton
                                  Properties:
                                    Text: =""
                                    Appearance: =ButtonAppearance.Transparent
                                    Layout: =ButtonLayout.TextOnly
                                    X: =0
                                    Y: =4
                                    Width: =Parent.TemplateWidth
                                    Height: =88
                                    DisplayMode: =If(locMode = "View" && !locSaving, DisplayMode.Edit, DisplayMode.Disabled)
                                    AccessibleLabel: =ThisItem.Caption
                                    OnSelect: '=UpdateContext({locSelPhoto: ThisItem, locPhotoError: ""})'
                  - conPhotoViewer:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =1
                        LayoutMinWidth: =480
                        Fill: =cWhite
                        BorderColor: =cBorder
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingTop: =8
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - conPhotoToolbar:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Height: =64
                              FillPortions: =0
                              LayoutMinHeight: =64
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =8
                            Children:
                              - txtPhotoToolbarTitle:
                                  Control: ModernText
                                  Properties:
                                    Text: |-
                                      =Switch(
                                          locMode,
                                          "Add", "New photo",
                                          "Annotate", "ANNOTATING · draw on the photo",
                                          If(IsBlank(locSelPhoto), "Select a photo to view or annotate it", locSelPhoto.Caption)
                                      )
                                    Size: =18
                                    FontWeight: =FontWeight.Semibold
                                    Color: =If(locMode = "Annotate", cPurple, If(IsBlank(locSelPhoto) && locMode = "View", cMuted, cText))
                                    FillPortions: =1
                                    LayoutMinWidth: =200
                                    Wrap: =false
                                    PaddingLeft: =0
                              - btnPhotoAnnotate:
                                  Control: ModernButton
                                  Properties:
                                    Visible: =locMode = "View" && !IsBlank(locSelPhoto)
                                    Text: ="Annotate"
                                    Icon: ="Edit"
                                    Appearance: =ButtonAppearance.Outline
                                    Color: =cPrimary
                                    Height: =48
                                    Width: =140
                                    Size: =16
                                    OnSelect: |-
                                      =UpdateContext({locMode: "Annotate", locPhotoError: "", locResetPen: !locResetPen})
                              - btnPhotoClearStrokes:
                                  Control: ModernButton
                                  Properties:
                                    Visible: =locMode = "Annotate"
                                    Text: ="Clear strokes"
                                    Layout: =ButtonLayout.TextOnly
                                    Appearance: =ButtonAppearance.Subtle
                                    Color: =cPrimary
                                    Height: =48
                                    Width: =130
                                    Size: =16
                                    DisplayMode: =If(locSaving, DisplayMode.Disabled, DisplayMode.Edit)
                                    OnSelect: '=UpdateContext({locResetPen: !locResetPen})'
                              - btnPhotoCancel:
                                  Control: ModernButton
                                  Properties:
                                    Visible: =locMode <> "View"
                                    Text: ="Cancel"
                                    Layout: =ButtonLayout.TextOnly
                                    Appearance: =ButtonAppearance.Outline
                                    Color: =cPrimary
                                    Height: =48
                                    Width: =110
                                    Size: =16
                                    DisplayMode: =If(locSaving, DisplayMode.Disabled, DisplayMode.Edit)
                                    OnSelect: |-
                                      =If(locMode = "Add", UpdateContext({locResetAdd: !locResetAdd}));
                                      UpdateContext({locMode: "View", locPhotoError: ""})
                              - btnPhotoSave:
                                  Control: ModernButton
                                  Properties:
                                    Visible: =locMode <> "View"
                                    Text: =If(locSaving, "Saving...", If(locMode = "Add", "Save photo", "Save annotation"))
                                    Layout: =ButtonLayout.TextOnly
                                    BasePaletteColor: =cPrimary
                                    Height: =48
                                    Width: =170
                                    Size: =16
                                    FontWeight: =FontWeight.Semibold
                                    DisplayMode: =If(locSaving, DisplayMode.Disabled, DisplayMode.Edit)
                                    OnSelect: |-
                                      =UpdateContext({locSaving: true, locPhotoError: ""});
                                      If(
                                          locMode = "Add",
                                          IfError(
                                              UpdateContext({
                                                  locSelPhoto: Patch(
                                                      'Inspection photos',
                                                      Defaults('Inspection photos'),
                                                      {
                                                          Caption: Coalesce(
                                                              Trim(txtPhotoCaption.Text),
                                                              varCtx.Number & " photo " & (CountRows(galPhotoList.AllItems) + 1)
                                                          ),
                                                          Inspection: LookUp(Inspections, Inspection = varCtx.InspectionId),
                                                          Photo: {Full: addPhotoPicker.Media, Value: addPhotoPicker.Media}
                                                      }
                                                  )
                                              });
                                              UpdateContext({locMode: "View", locResetAdd: !locResetAdd}),
                                              UpdateContext({locPhotoError: "The photo couldn't be saved. Your picture and caption are kept; try again."})
                                          ),
                                          IfError(
                                              UpdateContext({
                                                  locSelPhoto: Patch(
                                                      'Inspection photos',
                                                      LookUp('Inspection photos', 'Inspection photo' = locSelPhoto.'Inspection photo'),
                                                      {'Canvas pen strokes': penPhotoAnnotate.Image}
                                                  )
                                              });
                                              UpdateContext({locMode: "View"}),
                                              UpdateContext({locPhotoError: "The annotation couldn't be saved. Your drawing is kept; try again."})
                                          )
                                      );
                                      UpdateContext({locSaving: false})
                        - txtPhotoError:
                            Control: ModernText
                            Properties:
                              Visible: =!IsBlank(locPhotoError)
                              Text: ="Error · " & locPhotoError
                              Size: =14
                              Color: =cError
                              Fill: =cErrorTint
                              BorderColor: =cError
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              Height: =44
                              PaddingLeft: =12
                              AlignInContainer: =AlignInContainer.Stretch
                        - txtPhotoHelper:
                            Control: ModernText
                            Properties:
                              Visible: =locMode = "View" && !IsBlank(locSelPhoto.'Canvas pen strokes')
                              Text: ="Annotating again replaces the saved strokes. Strokes are stored as a separate image, not merged into the photo."
                              Size: =14
                              Color: =cMuted
                              Height: =24
                              PaddingLeft: =0
                              AlignInContainer: =AlignInContainer.Stretch
                        - conPhotoFrame:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              FillPortions: =1
                              LayoutMinHeight: =240
                              Fill: =cWhite
                              DropShadow: =DropShadow.None
                              AlignInContainer: =AlignInContainer.Stretch
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - txtPhotoNothing:
                                  Control: ModernText
                                  Properties:
                                    Visible: =locMode = "View" && IsBlank(locSelPhoto)
                                    Text: =If(CountRows(galPhotoList.AllItems) = 0, "Add a picture to get started.", "Select a photo to view or annotate it.")
                                    X: =0
                                    Y: =Parent.Height / 2 - 20
                                    Width: =Parent.Width
                                    Height: =40
                                    Size: =16
                                    Color: =cMuted
                                    Align: =Align.Center
                              - conPhotoLetterbox:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    Visible: =locMode <> "View" || !IsBlank(locSelPhoto)
                                    X: =(Parent.Width - Min(Parent.Width, (Parent.Height - If(locMode = "Add", 96, 0)) * 4 / 3)) / 2
                                    Y: =0
                                    Width: =Min(Parent.Width, (Parent.Height - If(locMode = "Add", 96, 0)) * 4 / 3)
                                    Height: =Min(Parent.Width, (Parent.Height - If(locMode = "Add", 96, 0)) * 4 / 3) * 3 / 4
                                    Fill: =cText
                                    BorderColor: =cPrimary
                                    BorderThickness: =If(locMode = "Annotate", 2, 0)
                                    DropShadow: =DropShadow.None
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                  Children:
                                    - imgPhotoMain:
                                        Control: Image
                                        Properties:
                                          Image: =If(locMode = "Add", addPhotoPicker.Media, locSelPhoto.Photo.Full)
                                          ImagePosition: =ImagePosition.Fit
                                          X: =0
                                          Y: =0
                                          Width: =Parent.Width
                                          Height: =Parent.Height
                                          AccessibleLabel: =If(locMode = "Add", "New photo", locSelPhoto.Caption)
                                    - imgPhotoStrokes:
                                        Control: Image
                                        Properties:
                                          Visible: =locMode = "View" && !IsBlank(locSelPhoto.'Canvas pen strokes')
                                          Image: =locSelPhoto.'Canvas pen strokes'.Full
                                          ImagePosition: =ImagePosition.Stretch
                                          X: =0
                                          Y: =0
                                          Width: =Parent.Width
                                          Height: =Parent.Height
                                          AccessibleLabel: ="Saved annotation strokes"
                                    - penPhotoAnnotate:
                                        Control: PenInput
                                        Properties:
                                          Visible: =locMode = "Annotate"
                                          Mode: =PenMode.Draw
                                          Color: =cError
                                          Size: =5
                                          Fill: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          ShowControls: =false
                                          Reset: =locResetPen
                                          X: =0
                                          Y: =0
                                          Width: =Parent.Width
                                          Height: =Parent.Height
                                          AccessibleLabel: ="Draw on the photo to mark defects"
                              - txtPhotoCaption:
                                  Control: ModernTextInput
                                  Properties:
                                    Visible: =locMode = "Add"
                                    Placeholder: ="Leave blank to use " & varCtx.Number & " photo " & (CountRows(galPhotoList.AllItems) + 1)
                                    Appearance: =Appearance.Outline
                                    BorderColor: =cMuted
                                    MaxLength: =200
                                    X: =(Parent.Width - 480) / 2
                                    Y: =Parent.Height - 56
                                    Width: =480
                                    Height: =48
                                    Size: =16
                                    AccessibleLabel: ="Caption"

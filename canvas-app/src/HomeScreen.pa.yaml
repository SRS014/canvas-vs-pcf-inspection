Screens:
  HomeScreen:
    Properties:
      Fill: =cWash
      LoadingSpinnerColor: =cPrimary
    Children:
      - conHomeRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =cWash
            DropShadow: =DropShadow.None
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
          Children:
            - htmHomeTopLine:
                Control: HtmlViewer
                Properties:
                  HtmlText: =HtmlLine(6, 0)
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  Height: =6
                  FillPortions: =0
                  LayoutMinHeight: =6
                  AlignInContainer: =AlignInContainer.Stretch
            - conHomeHero:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  Height: =128
                  FillPortions: =0
                  LayoutMinHeight: =128
                  AlignInContainer: =AlignInContainer.Stretch
                  DropShadow: =DropShadow.None
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - htmHomeHeroWash:
                      Control: HtmlViewer
                      Properties:
                        HtmlText: =HtmlWash(Parent.Height)
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        X: =0
                        Y: =0
                        Width: =Parent.Width
                        Height: =Parent.Height
                  - imgHomeLogo:
                      Control: Image
                      Properties:
                        TabIndex: =0
                        Image: =BrandSymbol
                        ImagePosition: =ImagePosition.Fit
                        X: =24
                        Y: =32
                        Width: =64
                        Height: =64
                        AccessibleLabel: ="The Fusion Platform"
                  - txtHomeEyebrow:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        Text: ="THE FUSION PLATFORM  ·  APP 1 OF 2  ·  BUILT WITH CANVAS"
                        X: =104
                        Y: =22
                        Width: =Parent.Width - 104 - 248
                        Height: =22
                        Size: =12
                        FontWeight: =FontWeight.Bold
                        Color: =cPurple
                        PaddingLeft: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                  - txtHomeTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        Text: ="Equipment inspections"
                        X: =104
                        Y: =44
                        Width: =Parent.Width - 104 - 248
                        Height: =40
                        Size: =28
                        FontWeight: =FontWeight.Bold
                        Color: =cText
                        PaddingLeft: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                  - txtHomeSub:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        Text: ="Multi-stage inspections across warehouse sites. Canvas controls and Power Fx on Dataverse."
                        X: =104
                        Y: =86
                        Width: =Parent.Width - 104 - 248
                        Height: =24
                        Size: =15
                        Color: =cMuted
                        Wrap: =false
                        PaddingLeft: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                  - btnHomeNew:
                      Control: ModernButton
                      Properties:
                        Text: ="New inspection"
                        Icon: ="Add"
                        X: =Parent.Width - 24 - 200
                        Y: =40
                        Height: =48
                        Width: =200
                        Size: =16
                        FontWeight: =FontWeight.Semibold
                        BasePaletteColor: =cPrimary
                        AccessibleLabel: ="Start a new inspection"
                        OnSelect: |-
                          =Set(varBannerText, "");
                          Navigate(StartScreen, ScreenTransition.None)
                  - conHomeHeroRule:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        X: =0
                        Y: =Parent.Height - 1
                        Width: =Parent.Width
                        Height: =1
                        Fill: =cBorder
                        DropShadow: =DropShadow.None
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
            - conHomeBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  PaddingTop: =20
                  PaddingBottom: =20
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - conHomeBanner:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Visible: =!IsBlank(varBannerText)
                        Height: =56
                        FillPortions: =0
                        LayoutMinHeight: =56
                        Fill: =cSuccessTint
                        BorderColor: =cSuccess
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =12
                        PaddingLeft: =16
                        PaddingRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - txtHomeBannerLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Text: ="✓  Submitted"
                              Size: =16
                              FontWeight: =FontWeight.Bold
                              Color: =cSuccess
                              Width: =130
                              LayoutMinWidth: =130
                        - txtHomeBannerText:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Text: =varBannerText
                              Size: =16
                              Color: =cText
                              FillPortions: =1
                              LayoutMinWidth: =200
                        - btnHomeBannerDismiss:
                            Control: ModernButton
                            Properties:
                              Text: ="Dismiss"
                              Layout: =ButtonLayout.TextOnly
                              Appearance: =ButtonAppearance.Subtle
                              Color: =cPrimary
                              Height: =48
                              Width: =110
                              AccessibleLabel: ="Dismiss the submitted message"
                              OnSelect: =Set(varBannerText, "")
                  - galHomeKpis:
                      Control: Gallery
                      Variant: Horizontal
                      Properties:
                        Items: |-
                          =With(
                              {
                                  submitted: Filter(Inspections, 'Status (fp_status)' = 'Inspection status'.Submitted),
                                  canvasCount: CountIf(Inspections, 'Built with' = [@'Built with'].'Canvas only'),
                                  pcfCount: CountIf(Inspections, 'Built with' = [@'Built with'].'Canvas + PCF')
                              },
                              Table(
                                  {Label: "Total inspections", Val: Text(CountIf(Inspections, true)), Sub: "", Alert: false},
                                  {Label: "Drafts", Val: Text(CountIf(Inspections, 'Status (fp_status)' = 'Inspection status'.Draft)), Sub: "", Alert: false},
                                  {Label: "Submitted", Val: Text(CountRows(submitted)), Sub: "", Alert: false},
                                  {
                                      Label: "High + Critical",
                                      Val: Text(CountIf(submitted, 'Risk band' = [@'Risk band'].High || 'Risk band' = [@'Risk band'].Critical)),
                                      Sub: "submitted inspections",
                                      Alert: true
                                  },
                                  {
                                      Label: "Average risk score",
                                      Val: If(CountRows(submitted) = 0, "–", Text(Average(submitted, 'Risk score'), "0.0")),
                                      Sub: If(CountRows(submitted) = 0, "no submitted inspections", "out of 100"),
                                      Alert: false
                                  },
                                  {Label: "Built with", Val: "Canvas " & canvasCount, Sub: "Canvas + PCF  " & pcfCount, Alert: false}
                              )
                          )
                        TemplateSize: =(Self.Width - 5 * 16) / 6
                        TemplatePadding: =0
                        Height: =112
                        FillPortions: =0
                        LayoutMinHeight: =112
                        AlignInContainer: =AlignInContainer.Stretch
                        Selectable: =false
                        ShowScrollbar: =false
                        BorderThickness: =0
                        TabIndex: =0
                        AccessibleLabel: ="Inspection summary"
                      Children:
                        - conHomeKpiCard:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth - 16
                              Height: =Parent.TemplateHeight
                              Fill: =cWhite
                              BorderColor: =cBorder
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                        - htmHomeKpiLine:
                            Control: HtmlViewer
                            Properties:
                              HtmlText: =HtmlLine(3, 8)
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth - 16
                              Height: =3
                        - txtHomeKpiLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Text: =ThisItem.Label
                              X: =16
                              Y: =14
                              Width: =Parent.TemplateWidth - 40
                              Height: =22
                              Size: =14
                              Color: =cMuted
                              Wrap: =false
                              PaddingLeft: =0
                              PaddingTop: =0
                              PaddingBottom: =0
                        - txtHomeKpiValue:
                            Control: ModernText
                            Properties:
                              Text: =ThisItem.Val
                              X: =16
                              Y: =38
                              Width: =Parent.TemplateWidth - 40
                              Height: =40
                              Size: =28
                              FontWeight: =FontWeight.Bold
                              Color: =If(ThisItem.Alert && ThisItem.Val <> "0", cError, cText)
                              Wrap: =false
                              PaddingLeft: =0
                              PaddingTop: =0
                              PaddingBottom: =0
                              AccessibleLabel: =ThisItem.Label & ", " & ThisItem.Val & If(IsBlank(ThisItem.Sub), "", ", " & ThisItem.Sub)
                        - txtHomeKpiSub:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Text: =ThisItem.Sub
                              Visible: =!IsBlank(ThisItem.Sub)
                              X: =16
                              Y: =80
                              Width: =Parent.TemplateWidth - 40
                              Height: =22
                              Size: =14
                              Color: =If(ThisItem.Label = "Built with", cPurple, cMuted)
                              FontWeight: =If(ThisItem.Label = "Built with", FontWeight.Semibold, FontWeight.Normal)
                              Wrap: =false
                              PaddingLeft: =0
                              PaddingTop: =0
                              PaddingBottom: =0
                  - conHomeListCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =cWhite
                        BorderColor: =cBorder
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - htmHomeListLine:
                            Control: HtmlViewer
                            Properties:
                              HtmlText: =HtmlLine(3, 8)
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              Height: =3
                              FillPortions: =0
                              LayoutMinHeight: =3
                              AlignInContainer: =AlignInContainer.Stretch
                        - conHomeListTitle:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Height: =52
                              FillPortions: =0
                              LayoutMinHeight: =52
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                            Children:
                              - txtHomeListHeading:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: ="Inspections"
                                    Size: =18
                                    FontWeight: =FontWeight.Bold
                                    Color: =cText
                                    Width: =130
                                    LayoutMinWidth: =120
                              - txtHomeListSub:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: ="Newest first · read-only"
                                    Size: =14
                                    Color: =cMuted
                                    FillPortions: =1
                        - conHomeColHeaders:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              Height: =36
                              FillPortions: =0
                              LayoutMinHeight: =36
                              Fill: =cWash
                              DropShadow: =DropShadow.None
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - txtHomeColInspection:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: ="INSPECTION"
                                    X: =16
                                    Y: =4
                                    Width: =200
                                    Size: =12
                                    FontWeight: =FontWeight.Bold
                                    Color: =cMuted
                              - txtHomeColEquipment:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: ="EQUIPMENT"
                                    X: =232
                                    Y: =4
                                    Width: =200
                                    Size: =12
                                    FontWeight: =FontWeight.Bold
                                    Color: =cMuted
                              - txtHomeColSite:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: ="SITE"
                                    X: =Parent.Width - 16 - 160 - 16 - 180 - 16 - 140 - 16 - 220 - 16
                                    Y: =4
                                    Width: =220
                                    Size: =12
                                    FontWeight: =FontWeight.Bold
                                    Color: =cMuted
                              - txtHomeColStatus:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: ="STATUS"
                                    X: =Parent.Width - 16 - 160 - 16 - 180 - 16 - 140 - 16
                                    Y: =4
                                    Width: =140
                                    Size: =12
                                    FontWeight: =FontWeight.Bold
                                    Color: =cMuted
                              - txtHomeColRisk:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: ="RISK"
                                    X: =Parent.Width - 16 - 160 - 16 - 180 - 16
                                    Y: =4
                                    Width: =180
                                    Size: =12
                                    FontWeight: =FontWeight.Bold
                                    Color: =cMuted
                              - txtHomeColBuilt:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: ="BUILT WITH"
                                    X: =Parent.Width - 16 - 160 - 16
                                    Y: =4
                                    Width: =160
                                    Size: =12
                                    FontWeight: =FontWeight.Bold
                                    Color: =cMuted
                        - galHomeInspections:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              Items: =Sort(Inspections, 'Created On', SortOrder.Descending)
                              TemplateSize: =64
                              TemplatePadding: =0
                              Height: =400
                              FillPortions: =1
                              LayoutMinHeight: =128
                              Selectable: =false
                              ShowScrollbar: =true
                              BorderThickness: =0
                              TabIndex: =0
                              LoadingSpinner: =LoadingSpinner.Data
                              LoadingSpinnerColor: =cPrimary
                              AccessibleLabel: ="Inspections, newest first"
                            Children:
                              - txtHomeRowNumber:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: =ThisItem.'Inspection number'
                                    X: =16
                                    Y: =8
                                    Width: =200
                                    Height: =26
                                    Size: =16
                                    FontWeight: =FontWeight.Semibold
                                    Color: =cPrimary
                              - txtHomeRowDate:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: =Text(ThisItem.'Started on', "dd mmm yyyy, hh:mm")
                                    X: =16
                                    Y: =32
                                    Width: =200
                                    Height: =24
                                    Size: =14
                                    Color: =cMuted
                              - txtHomeRowEquipment:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: =ThisItem.Equipment.'Equipment name'
                                    X: =232
                                    Y: =8
                                    Width: =Max(120, Parent.TemplateWidth - 16 - 160 - 16 - 180 - 16 - 140 - 16 - 220 - 16 - 232 - 16)
                                    Height: =26
                                    Size: =16
                                    Color: =cText
                                    Wrap: =false
                              - txtHomeRowAsset:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: =ThisItem.Equipment.'Asset tag'
                                    X: =232
                                    Y: =32
                                    Width: =Max(120, Parent.TemplateWidth - 16 - 160 - 16 - 180 - 16 - 140 - 16 - 220 - 16 - 232 - 16)
                                    Height: =24
                                    Size: =14
                                    Color: =cMuted
                              - txtHomeRowSite:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: =ThisItem.Site.'Site name'
                                    X: =Parent.TemplateWidth - 16 - 160 - 16 - 180 - 16 - 140 - 16 - 220 - 16
                                    Y: =8
                                    Width: =220
                                    Height: =26
                                    Size: =16
                                    Color: =cText
                                    Wrap: =false
                              - txtHomeRowSiteCode:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: =ThisItem.Site.'Site code'
                                    X: =Parent.TemplateWidth - 16 - 160 - 16 - 180 - 16 - 140 - 16 - 220 - 16
                                    Y: =32
                                    Width: =220
                                    Height: =24
                                    Size: =14
                                    Color: =cMuted
                              - txtHomeRowStatus:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: =Text(ThisItem.'Status (fp_status)')
                                    X: =Parent.TemplateWidth - 16 - 160 - 16 - 180 - 16 - 140 - 16
                                    Y: =16
                                    Width: =104
                                    Height: =32
                                    Size: =14
                                    FontWeight: =FontWeight.Semibold
                                    Align: =Align.Center
                                    Color: =If(ThisItem.'Status (fp_status)' = 'Inspection status'.Submitted, cPrimary, cMuted)
                                    Fill: =If(ThisItem.'Status (fp_status)' = 'Inspection status'.Submitted, cPrimaryTint, cWhite)
                                    BorderColor: =If(ThisItem.'Status (fp_status)' = 'Inspection status'.Submitted, cPrimaryTint, cMuted)
                                    BorderThickness: =1
                                    BorderStyle: =BorderStyle.Solid
                                    RadiusTopLeft: =16
                                    RadiusTopRight: =16
                                    RadiusBottomLeft: =16
                                    RadiusBottomRight: =16
                              - txtHomeRowRisk:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: |-
                                      =If(
                                          ThisItem.'Status (fp_status)' = 'Inspection status'.Submitted,
                                          If(Text(ThisItem.'Risk band') = "Critical", "⛔ ", "") &
                                          Text(ThisItem.'Risk score', "0.0") & " · " & Text(ThisItem.'Risk band'),
                                          "Not scored"
                                      )
                                    X: =Parent.TemplateWidth - 16 - 160 - 16 - 180 - 16
                                    Y: =16
                                    Width: =168
                                    Height: =32
                                    Size: =14
                                    FontWeight: =FontWeight.Semibold
                                    Align: =Align.Center
                                    Color: |-
                                      =If(
                                          ThisItem.'Status (fp_status)' <> 'Inspection status'.Submitted, cMuted,
                                          Text(ThisItem.'Risk band') = "Critical", cWhite,
                                          BandColor(Text(ThisItem.'Risk band'))
                                      )
                                    Fill: |-
                                      =If(
                                          ThisItem.'Status (fp_status)' <> 'Inspection status'.Submitted, cWhite,
                                          BandTint(Text(ThisItem.'Risk band'))
                                      )
                                    BorderColor: |-
                                      =If(
                                          ThisItem.'Status (fp_status)' <> 'Inspection status'.Submitted, cBorder,
                                          BandColor(Text(ThisItem.'Risk band'))
                                      )
                                    BorderThickness: =If(Text(ThisItem.'Risk band') = "High", 2, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                              - txtHomeRowBuilt:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Text: =Upper(Text(ThisItem.'Built with'))
                                    Visible: =!IsBlank(ThisItem.'Built with')
                                    X: =Parent.TemplateWidth - 16 - 160
                                    Y: =18
                                    Width: =130
                                    Height: =28
                                    Size: =12
                                    FontWeight: =FontWeight.Bold
                                    Align: =Align.Center
                                    Color: =cPurple
                                    Fill: =cLavender
                                    BorderColor: =cPurple
                                    BorderThickness: =1
                                    BorderStyle: =BorderStyle.Solid
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                              - conHomeRowDivider:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    X: =16
                                    Y: =Parent.TemplateHeight - 1
                                    Width: =Parent.TemplateWidth - 32
                                    Height: =1
                                    Fill: =cBorder
                                    DropShadow: =DropShadow.None
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                        - txtHomeEmpty:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Visible: =galHomeInspections.AllItemsCount = 0
                              Text: ="No inspections yet. Start one with New inspection."
                              Size: =16
                              Color: =cMuted
                              Align: =Align.Center
                              Height: =48
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
            - htmHomeFootLine:
                Control: HtmlViewer
                Properties:
                  HtmlText: =HtmlLine(2, 0)
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  Height: =2
                  FillPortions: =0
                  LayoutMinHeight: =2
                  AlignInContainer: =AlignInContainer.Stretch
            - conHomeFooter:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =40
                  FillPortions: =0
                  LayoutMinHeight: =40
                  Fill: =cWhite
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =12
                  PaddingLeft: =24
                  PaddingRight: =24
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - txtHomeFooterBrand:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        Text: ="The Fusion Platform by Sohan"
                        Size: =14
                        FontWeight: =FontWeight.Bold
                        Color: =cPrimary
                        Width: =220
                        LayoutMinWidth: =220
                        PaddingLeft: =0
                  - txtHomeFooterTagline:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        Text: =BrandTagline
                        Size: =14
                        Color: =cMuted
                        FillPortions: =1
                        Wrap: =false
                  - txtHomeFooterProject:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        Text: ="Canvas vs PCF  ·  App 1 of 2"
                        Size: =14
                        Color: =cMuted
                        Align: =Align.Right
                        Width: =240
                        LayoutMinWidth: =200
